name: opentelemetry
version: "1.0.0"
description: >
  Standard OpenTelemetry observability for Hermes — traces turns, LLM calls,
  and tool usage with OpenInference GenAI semantics via OTLP. Preferred over
  the deprecated observability/langfuse plugin. Opt-in via
  `hermes plugins enable observability/opentelemetry`.
author: Ferris Storke
requires_env: []
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
replaces: observability/langfuse
